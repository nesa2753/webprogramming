<html>
<body bgcolor="pink">
<h1><center><i>STRING AND MATHFUNCTIONS</i></center></h1>
<script>
var a="Hello";
var b="Welcome ,";
var c=" i am nesa";
document.write("string 1:" + a + "<br><br>");
document.write("string 2:" + b + "<br><br>");
document.write("string 3:" + c + "<br><br>");
document.write("<h2> STRING FUNCTIONS </h2>");

document.write("concate:" + a + b + c + "<br><br>");
document.write("toUppercase = " + a.toUpperCase() + "<br><br>");
document.write("toLowercase = " + b.toLowerCase() + "<br><br>");
document.write("Length = " +a.length + "<br><br>");
document.write("Replace =" + a.replace(a,b) + "<br><br>");

document.write("<h3> MATH FUNCTIONS </h3>");

document.write("Round =" + Math.round(4.6) + "<br><br>");
document.write("Floor =" + Math.floor(4.6) + "<br><br>");
document.write("Ceil =" + Math.ceil(4.1) + "<br><br>");
document.write("Square root =" + Math.sqrt(25) + "<br><br>");
document.write("Power =" + Math.pow(2,3) + "<br><br>");
document.write("Absolute value =" + Math.abs(-10) + "<br><br>");
document.write("Maximum value =" + Math.max(10,20,15) + "<br><br>");
document.write("Minimum value =" + Math.min(10,20,15) + "<br><br>");

</script>
</body>
</html>
